name: Scraper Imovelweb

on:
  schedule:
    - cron: '0 */6 * * *'   # continua de onde parou; estados concluídos são pulados
  workflow_dispatch:
    inputs:
      reset:
        description: 'Recomeçar do zero (--reset)'
        type: boolean
        default: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  RESET_FLAG: ${{ inputs.reset && '--reset' || '' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # Anúncios aproximados (set/2026): SP 3,9 mi | RS 481 mil | RJ 449 mil | MG 340 mil.
          # Com a página de cada anúncio (~7/s por job), SP num job só levaria ~6,5 dias:
          # dividido em 4 partes (segmentos de preço repartidos entre elas), ~2 dias.
          - grupo: sp-1
            estados: SP
            parte: 1/4
          - grupo: sp-2
            estados: SP
            parte: 2/4
          - grupo: sp-3
            estados: SP
            parte: 3/4
          - grupo: sp-4
            estados: SP
            parte: 4/4
          - grupo: rj
            estados: RJ
            parte: 1/1
          - grupo: rs
            estados: RS
            parte: 1/1
          - grupo: mg
            estados: MG
            parte: 1/1
          - grupo: pr-sc
            estados: PR,SC
            parte: 1/1
          - grupo: outros
            estados: BA,GO,DF,ES,PE,MT,PB,CE,SE,MS,AL,RN,RO,PI,PA,AM,MA,TO,AC,AP,RR
            parte: 1/1
    concurrency:
      group: imovelweb-${{ matrix.grupo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scrape ${{ matrix.estados }} (parte ${{ matrix.parte }})
        run: python main.py --portal imovelweb --estado ${{ matrix.estados }} --parte ${{ matrix.parte }} --workers 12 --passadas 2 $RESET_FLAG
