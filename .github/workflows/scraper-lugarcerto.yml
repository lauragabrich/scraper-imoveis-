name: Scraper Lugar Certo

on:
  schedule:
    # De hora em hora: o GitHub não garante o horário e às vezes pula execuções agendadas.
    # Se o job anterior ainda roda, o novo espera na fila (concurrency) e começa quando ele
    # termina; estados já concluídos terminam em segundos.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Recomeçar do zero (--reset)'
        type: boolean
        default: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  RESET_FLAG: ${{ inputs.reset && '--reset' || '' }}

jobs:
  # MG tem ~55 mil dos ~75 mil anúncios do portal
  mg:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: lugarcerto-mg
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scrape MG
        run: python main.py --portal lugarcerto --estado MG --workers 4 $RESET_FLAG

  outros:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: lugarcerto-outros
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scrape demais estados
        run: python main.py --portal lugarcerto --estado GO,SP,RJ,ES,PE,DF,AM,PR,RS,CE,AL,BA,SC,MA,PB,MS,TO,RN,SE,PA,MT,AC,AP,PI,RO,RR --workers 4 $RESET_FLAG

  # Ao fim de cada ciclo (~6h), se algum job não concluiu, dispara o próximo ciclo na
  # hora: não depende do agendamento do GitHub, que às vezes não dispara (em 29/09 o
  # VivaReal ficou horas parado assim). Trava: se o ciclo durou menos de 30 min (erro
  # rápido), não redispara, para não virar loop.
  # Para PARAR a coleta, desative o workflow (Actions -> ... -> Disable workflow);
  # cancelar a execução não basta, porque este passo dispara a próxima.
  continuar:
    needs: [mg, outros]
    if: always() && (needs.mg.result != 'success' || needs.outros.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disparar o próximo ciclo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inicio=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          minutos=$(( ( $(date +%s) - $(date -d "$inicio" +%s) ) / 60 ))
          if [ "$minutos" -lt 30 ]; then
            echo "Ciclo durou só $minutos min: não redispara (veja os logs dos jobs)."
            exit 0
          fi
          gh workflow run scraper-lugarcerto.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Próximo ciclo disparado."
