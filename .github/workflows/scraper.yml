name: Scraper VivaReal

on:
  schedule:
    # De hora em hora: o GitHub não garante o horário e às vezes pula execuções agendadas.
    # Se o job anterior ainda roda, o novo espera na fila (concurrency) e começa quando ele
    # termina; estados já concluídos terminam em segundos.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Nova coleta do zero (--reset): zera o progresso e grava numa pasta coleta=<data> nova'
        type: boolean
        default: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  RESET_FLAG: ${{ inputs.reset && '--reset' || '' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # Anúncios (set/2026): Brasil 3,7 mi venda + 0,9 mi aluguel; SP 2,2 mi + 0,57 mi.
          # O gargalo é o detalhe (1 requisição por anúncio, ~1,5 req/s por job para não
          # ser bloqueado), então SP é dividido em 6 partes (~460 mil anúncios cada) e os
          # demais estados agrupados em jobs de ~300 mil. Cada job roda noutra máquina/IP.
          - grupo: sp-1
            estados: SP
            parte: 1/6
          - grupo: sp-2
            estados: SP
            parte: 2/6
          - grupo: sp-3
            estados: SP
            parte: 3/6
          - grupo: sp-4
            estados: SP
            parte: 4/6
          - grupo: sp-5
            estados: SP
            parte: 5/6
          - grupo: sp-6
            estados: SP
            parte: 6/6
          - grupo: mg
            estados: MG
            parte: 1/1
          - grupo: rj-es
            estados: RJ,ES
            parte: 1/1
          - grupo: rs
            estados: RS
            parte: 1/1
          - grupo: pr-sc
            estados: PR,SC
            parte: 1/1
          - grupo: nordeste-norte
            estados: BA,PE,CE,PA,AM,MA,PB,RN,AL,PI,SE,TO,RO,AC,AP,RR
            parte: 1/1
          - grupo: centro-oeste
            estados: GO,DF,MT,MS
            parte: 1/1
    concurrency:
      group: vivareal-${{ matrix.grupo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scrape ${{ matrix.estados }} (parte ${{ matrix.parte }})
        run: python main.py --estado ${{ matrix.estados }} --parte ${{ matrix.parte }} --workers 4 $RESET_FLAG

  # Ao fim de cada ciclo (~6h), se algum job não concluiu, dispara o próximo ciclo na
  # hora: não depende do agendamento do GitHub, que às vezes não dispara (em 29/09 o
  # VivaReal ficou horas parado assim). Trava: se o ciclo durou menos de 30 min (erro
  # rápido), não redispara, para não virar loop.
  # Para PARAR a coleta, desative o workflow (Actions -> ... -> Disable workflow);
  # cancelar a execução não basta, porque este passo dispara a próxima.
  continuar:
    needs: [scrape]
    if: always() && (needs.scrape.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disparar o próximo ciclo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inicio=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          minutos=$(( ( $(date +%s) - $(date -d "$inicio" +%s) ) / 60 ))
          if [ "$minutos" -lt 30 ]; then
            echo "Ciclo durou só $minutos min: não redispara (veja os logs dos jobs)."
            exit 0
          fi
          gh workflow run scraper.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Próximo ciclo disparado."
