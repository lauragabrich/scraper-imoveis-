name: Scraper VivaReal

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado (ex: SP, RJ, MG ou ALL)'
        required: false
        default: 'ALL'
      limit:
        description: 'Limite de anúncios (vazio = sem limite)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: scraper-vivareal
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ODBC Driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - run: pip install -r requirements.txt

      - name: Debug conexão
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
        run: |
          python -c "
          import socket, os
          server = os.environ['AZURE_SQL_SERVER']
          print(f'Tamanho do server: {len(server)}')
          print(f'Primeiros 5 chars: {server[:5]}')
          print(f'Ultimos 5 chars: {server[-5:]}')
          print(f'Tem espaco: {\" \" in server}')
          print(f'Tem newline: {chr(10) in server or chr(13) in server}')
          print(f'Repr: {repr(server)}')
          # Tenta resolver
          try:
              ip = socket.gethostbyname(server)
              print(f'IP resolvido: {ip}')
          except Exception as e:
              print(f'Erro DNS: {e}')
          # Tenta com valor hardcoded pra comparar
          try:
              ip2 = socket.gethostbyname('servidorimoveis.database.windows.net')
              print(f'IP hardcoded: {ip2}')
          except Exception as e2:
              print(f'Erro hardcoded: {e2}')
          "

      - name: Acordar banco Azure SQL
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          python -c "
          import time, pyodbc, os
          conn_str = (
              f\"DRIVER={{ODBC Driver 18 for SQL Server}};\"
              f\"SERVER={os.environ['AZURE_SQL_SERVER']};\"
              f\"DATABASE={os.environ['AZURE_SQL_DATABASE']};\"
              f\"UID={os.environ['AZURE_SQL_USER']};\"
              f\"PWD={os.environ['AZURE_SQL_PASSWORD']};\"
              f\"Encrypt=yes;TrustServerCertificate=no;Connection Timeout=300;\"
          )
          for i in range(5):
              try:
                  print(f'Tentativa {i+1}/5...', flush=True)
                  conn = pyodbc.connect(conn_str)
                  conn.execute('SELECT 1')
                  conn.close()
                  print('Banco acordado!', flush=True)
                  break
              except Exception as e:
                  print(f'Aguardando banco acordar... ({e})', flush=True)
                  time.sleep(60)
          "

      - name: Rodar scraper
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          ESTADO="${{ github.event.inputs.estado || 'ALL' }}"
          LIMIT="${{ github.event.inputs.limit }}"

          if [ "$ESTADO" = "ALL" ]; then
            CMD="python main.py --all-estados"
          else
            CMD="python main.py --estado $ESTADO"
          fi

          if [ -n "$LIMIT" ]; then
            CMD="$CMD --limit $LIMIT"
          fi

          echo "Executando: $CMD"
          $CMD
