name: Scraper VivaReal

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado (ex: SP, RJ, MG ou ALL)'
        required: false
        default: 'ALL'
      limit:
        description: 'Limite de anúncios (vazio = sem limite)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: scraper-vivareal
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ODBC Driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - run: pip install -r requirements.txt

      - name: Rodar scraper
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          ESTADO="${{ github.event.inputs.estado || 'ALL' }}"
          LIMIT="${{ github.event.inputs.limit }}"

          if [ "$ESTADO" = "ALL" ]; then
            CMD="python main.py --all-estados"
          else
            CMD="python main.py --estado $ESTADO"
          fi

          if [ -n "$LIMIT" ]; then
            CMD="$CMD --limit $LIMIT"
          fi

          echo "Executando: $CMD"
          $CMD
